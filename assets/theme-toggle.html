<!-- ============================================================
     0x theme toggle — the standard sun/moon button.
     Never ship a "THEME" text button. Copy the three blocks below.
     Dark is the home theme: the moon shows by default, the sun
     appears only when the light theme is active.
     ============================================================ -->

<!-- 1. PRE-PAINT (inline in <head>, before any CSS) — sets the theme
        before first paint so a stored choice never flashes. -->
<script>
    (() => {
        try {
            const q = new URLSearchParams(location.search).get("theme");
            const t = q || localStorage.getItem("0x-theme");
            if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch (_) {}
    })();
</script>

<!-- 2. THE BUTTON — drop in your header. The icon shown reflects the
        current mode (moon in dark, sun in light); the swap is CSS, so
        it's correct on first paint. theme.js keeps the aria-label fresh. -->
<button type="button" class="ox-theme-toggle"
        data-ox-theme-toggle aria-pressed="true"
        aria-label="Switch to light theme" title="Switch theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.6v2.4M12 19v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.6 12h2.4M19 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" />
    </svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A8.6 8.6 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8z" />
    </svg>
</button>

<!-- 3. THE STYLES — uses tokens.css variables; the icon swap mirrors
        the token cascade (dark default) so it never disagrees with
        the page. The 44px box keeps the touch target honest. -->
<style>
    .ox-theme-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 44px; min-width: 44px; height: 44px; min-height: 44px; padding: 0;
        flex: 0 0 44px;
        background: none; border: 1px solid var(--hairline); color: var(--text-muted);
        border-radius: var(--radius);
        cursor: pointer; transition: border-color 0.2s, color 0.2s;
    }
    .ox-theme-toggle:hover { border-color: var(--shine); color: var(--shine); }
    .ox-theme-toggle:focus-visible { outline: 2px solid var(--shine); outline-offset: 2px; }
    .ox-theme-toggle svg { width: 17px; height: 17px; }

    /* Dark is the default: the moon shows unless light is active. */
    .ox-theme-toggle .sun { display: none; }
    :root[data-theme="light"] .ox-theme-toggle .sun { display: inline; }
    :root[data-theme="light"] .ox-theme-toggle .moon { display: none; }
    @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) .ox-theme-toggle .sun { display: inline; }
        :root:not([data-theme="dark"]) .ox-theme-toggle .moon { display: none; }
    }
    /* A forced-dark page while the OS is light must show the moon again. */
    :root[data-theme="dark"] .ox-theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .ox-theme-toggle .moon { display: inline; }
</style>
